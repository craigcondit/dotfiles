# standard bindings

# Global / Misc.:
# C-b Send prefix key to application
# C-o Rotate the panes in the currnet window forwards
# : Enter the tmux command prompt
# ? List all key bindings
# t Show the time
# ~ Show previous messages from tmux, if any

# Client management:
# C-z Suspend the tmux client
# d detach the current client
# D Choose a client to detach
# r Force redraw of the attached client

# Pane management:
# ! Break the current pane out into its own window
# " Split the current pane horizontally
# % Split the current pane vertically
# q Briefly display pane indexes
# ; Move to the previously active pane
# o Move to the next pane in the current window
# x Kill the current pane
# { Swap the current pane with the previous pane
# } Swap the current pane with the next pane
# Up, Down Change to the pane above or below the current pane
# Left, Right Change to the pane to the left or right of the current pane
# Meta-1 Arrange panes using even-horizontal preset
# Meta-2 Arrange panes using even-vertical preset
# Meta-3 Arrange panes using main-horizontal preset
# Meta-4 Arrange panes using main-vertical preset
# Meta-5 Arrange panes using tiled preset
# Space  Arrange panes using next preset layout
# Meta-o Rotate the panes in the current window backwards
# C-[Arrow] Resize the current pane in steps of one cell.
# Meta-[Arrow] Resize the current pane in steps of five cells.

# Window management:
# c Create a new window
# & Kill the current window
# w Choose the current window interactively
# ' Prompt for a window index to select
# , Rename the current window
# . Prompt for a window index to move 
# 0-9 Select windows 0 to 9
# f Prompt to search for text in open windows
# i Display information about the current window
# n Change to the next window 
# p Change to the previous window
# l Change to the previously selected window
# Meta-n Move to the next window with a bell or activity marker
# Meta-p Move to the previous window with a bell or activity marker

# Session management:
# $ Rename the current session
# ( Switch the attached client to the previous session
# ) Switch the attached client to the next session
# L Switch the attached client back to the last session
# s Select a new session for the attached client interactivel# ~ Show previous messages from tmux, if any

# Copy / Paste:
# # List all paste buffers
# - Delete the most recently copied buffer of text
# = Choose which buffer to paste interactively from a list
# [ Enter copy mode to copy text or view the history
# ] Paste the most recently copied buffer of text
# Page Up   Enter copy mode and scroll one page up



# Reload tmux configuration dynamically 
bind R source-file ~/.config/tmux/tmux.conf

# Use 'v' for vi copy-mode selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
