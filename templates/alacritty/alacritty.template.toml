live_config_reload = true
shell = "/bin/zsh"

[env]
TERM = "xterm-256color"

[window]
padding = { x = 4, y = 4 }
opacity = 0.9
decorations = "${ALACRITTY__WINDOW_DECORATIONS}"
blur = true
dynamic_title = true
dynamic_padding = true
dimensions = { columns = 132, lines = 40 }
resize_increments = true
option_as_alt = "Both"

[bell]
animation = "EaseOutExpo"
duration = 300
color = "0xffffff"

[scrolling]
history = 10000

[font]
normal = { family = "RobotoMono Nerd Font Mono", style = "Light" }
bold = { style = "Regular" }
italic = { style = "Light Italic" }
bold_italic = { style = "Italic" }
size = ${ALACRITTY__FONT_SIZE}

[colors.primary]
foreground = "#fba709"

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[hints]
enabled = []

[[keyboard.bindings]]
key = "N"
action = "SpawnNewInstance"
mods = "Control|Shift"
